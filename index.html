<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b6bcb"><title>Hand Hygiene Audit</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f7fb;color:#142033}header{background:linear-gradient(135deg,#075bb3,#0b86d8);color:#fff;padding:22px 18px 18px;border-radius:0 0 24px 24px;box-shadow:0 4px 18px #0002}h1{margin:0;font-size:25px}.sub{opacity:.9;margin-top:5px;font-size:13px}.wrap{max-width:760px;margin:auto;padding:16px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.tab{border:0;border-radius:14px;padding:13px;background:#fff;font-weight:700;color:#526074}.tab.active{background:#0b6bcb;color:white}.card{background:white;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 2px 12px #1b35500d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:#526074;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid #d9e1eb;border-radius:11px;padding:12px;font-size:15px;background:#fff}textarea{min-height:70px}.moment{border:1px solid #e0e6ee;border-radius:14px;padding:13px;margin:9px 0}.moment strong{display:block;font-size:14px}.opts{display:flex;gap:8px;margin-top:10px}.opts button{flex:1;border:1px solid #d8e0ea;background:#f7f9fc;border-radius:10px;padding:10px;font-weight:700}.opts button.sel-y{background:#dff7e8;border-color:#2eaf68;color:#147442}.opts button.sel-n{background:#ffe5e5;border-color:#df5a5a;color:#a92727}.opts button.sel-na{background:#e9eef5;border-color:#9ba8b8;color:#445366}.primary{width:100%;border:0;border-radius:13px;background:#0b6bcb;color:white;padding:14px;font-size:16px;font-weight:800;margin-top:8px}.danger{background:#fff0f0;color:#a92727;border:1px solid #ffd1d1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.stat{background:#f7faff;border-radius:14px;padding:13px;text-align:center}.num{font-size:22px;font-weight:800;color:#0b6bcb}.small{font-size:11px;color:#69778a}.hidden{display:none}.record{border-left:4px solid #0b6bcb;padding:11px 12px;background:#f8fbff;border-radius:10px;margin:9px 0}.record b{font-size:14px}.record .small{margin-top:3px;display:block}.bar{height:9px;background:#e7edf5;border-radius:10px;overflow:hidden;margin-top:8px}.fill{height:100%;background:#20a56b}.empty{text-align:center;padding:28px;color:#78869a;font-size:14px}@media(max-width:520px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}}
</style></head>
<body>
<header><div class="wrap"><h1>🧴 Hand Hygiene Audit</h1><div class="sub">Infection Prevention & Control • Mobile Audit</div></div></header>
<div class="wrap">
<div class="tabs"><button class="tab active" onclick="show('audit',this)">➕ New Audit</button><button class="tab" onclick="show('dashboard',this)">📊 Dashboard</button></div>
<section id="audit">
<div class="card"><div class="grid">
<div><label>Date</label><input id="date" type="date"></div><div><label>Time</label><input id="time" type="time"></div>
<div><label>Ward / Unit</label><input id="ward" placeholder="e.g. PICU"></div><div><label>Observer / ICN</label><input id="observer" placeholder="Name"></div>
<div><label>Healthcare worker</label><input id="staff" placeholder="Name / ID"></div><div><label>Profession</label><select id="profession"><option>Nurse</option><option>Doctor</option><option>Housekeeping</option><option>Technician</option><option>Other</option></select></div>
</div></div>
<div class="card"><h3 style="margin-top:0">WHO 5 Moments</h3><div id="moments"></div></div>
<div class="card"><label>Remarks / Corrective action</label><textarea id="remarks" placeholder="Add observation or feedback..."></textarea><button class="primary" onclick="saveAudit()">💾 Save Audit</button></div>
</section>
<section id="dashboard" class="hidden">
<div class="card"><div class="stats"><div class="stat"><div class="num" id="total">0</div><div class="small">Audits</div></div><div class="stat"><div class="num" id="opp">0</div><div class="small">Opportunities</div></div><div class="stat"><div class="num" id="rate">0%</div><div class="small">Compliance</div></div></div></div>
<div class="card"><h3 style="margin-top:0">Recent Audits</h3><div id="records"></div><button class="primary danger" onclick="exportCSV()">⬇️ Export CSV</button></div>
</section>
</div>
<script>
const moments=["Before touching a patient","Before clean / aseptic procedure","After body fluid exposure risk","After touching a patient","After touching patient surroundings"];
const box=document.getElementById('moments');let answers={};
moments.forEach((m,i)=>{answers[i]='';box.innerHTML+=`<div class="moment"><strong>${i+1}. ${m}</strong><div class="opts"><button id="y${i}" onclick="pick(${i},'Yes')">✓ Yes</button><button id="n${i}" onclick="pick(${i},'No')">✕ No</button><button id="a${i}" onclick="pick(${i},'NA')">N/A</button></div></div>`});
function pick(i,v){answers[i]=v;['y','n','a'].forEach(x=>document.getElementById(x+i).className='');document.getElementById(({Yes:'y',No:'n',NA:'a'})[v]+i).className='sel-'+({Yes:'y',No:'n',NA:'na'})[v]}
function show(id,el){document.getElementById('audit').classList.toggle('hidden',id!=='audit');document.getElementById('dashboard').classList.toggle('hidden',id!=='dashboard');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));el.classList.add('active');if(id==='dashboard')render()}
function saveAudit(){let vals=Object.values(answers), opp=vals.filter(x=>x==='Yes'||x==='No').length;if(!document.getElementById('ward').value||!document.getElementById('observer').value){alert('Please enter Ward/Unit and Observer name.');return}if(!opp){alert('Please record at least one hand hygiene opportunity.');return}let data=JSON.parse(localStorage.getItem('hhaudits')||'[]');data.unshift({date:date.value,time:time.value,ward:ward.value,observer:observer.value,staff:staff.value,profession:profession.value,answers:[...vals],remarks:remarks.value});localStorage.setItem('hhaudits',JSON.stringify(data));alert('Audit saved successfully ✓');location.reload()}
function render(){let data=JSON.parse(localStorage.getItem('hhaudits')||'[]'), yes=0,opp=0;data.forEach(r=>r.answers.forEach(x=>{if(x==='Yes'){yes++;opp++}else if(x==='No')opp++}));total.textContent=data.length;document.getElementById('opp').textContent=opp;rate.textContent=(opp?Math.round(yes/opp*100):0)+'%';records.innerHTML=data.length?data.slice(0,30).map(r=>{let o=r.answers.filter(x=>x==='Yes'||x==='No').length,y=r.answers.filter(x=>x==='Yes').length,p=o?Math.round(y/o*100):0;return `<div class="record"><b>${r.ward||'—'} • ${r.profession}</b><span class="small">${r.date||''} ${r.time||''} • Observer: ${r.observer||'—'}</span><div class="bar"><div class="fill" style="width:${p}%"></div></div><span class="small">Compliance: ${p}% • Opportunities: ${o}</span></div>`}).join(''):'<div class="empty">No audits saved yet.</div>'}
function exportCSV(){let data=JSON.parse(localStorage.getItem('hhaudits')||'[]');if(!data.length){alert('No audit data to export.');return}let rows=[['Date','Time','Ward','Observer','Staff','Profession',...moments,'Remarks']];data.forEach(r=>rows.push([r.date,r.time,r.ward,r.observer,r.staff,r.profession,...r.answers,r.remarks]));let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='hand-hygiene-audit.csv';a.click()}
let now=new Date();date.value=now.toISOString().slice(0,10);time.value=now.toTimeString().slice(0,5);render();
</script></body></html>
